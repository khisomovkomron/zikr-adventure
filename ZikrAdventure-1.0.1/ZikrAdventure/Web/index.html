<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zikr Adventure</title>
<style>
:root{
  --bg:#E6E0D4; --bg2:#DCD3C2; --surface:#F6F2EA; --surface2:#FFFFFF; --text:#1C2333; --text2:#5A5F6B;
  --accent:#8E6E2E; --accentSoft:#E8DBBE; --navy:#1B2A44; --positive:#2F6B4F; --warning:#96550F;
  --disabled:#A6A298; --divider:#CFC5B1; --locked:#8B8A86; --sea:#BCD0D3; --land:#E5D3AE; --country:#D9BD88;
  --border:#A88A55; --mount:#9E7F5C; --shadow:0 6px 20px rgba(20,24,36,.10);
  --serif:ui-serif,"New York",Georgia,serif; --sans:-apple-system,system-ui,"Helvetica Neue",sans-serif;
  --arabic:"Geeza Pro","Amiri","Traditional Arabic",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --bg2:#141C2C; --surface:#1A2334; --surface2:#222C41; --text:#EFE8DA; --text2:#AFA99D;
    --accent:#CBA863; --accentSoft:#3A3322; --navy:#2C3F63; --positive:#6FBF94; --warning:#E0A458;
    --disabled:#5C5A56; --divider:#2C3548; --locked:#6D6C69; --sea:#0F2230; --land:#3A3326; --country:#4A3F2C;
    --border:#A88A55; --mount:#8E7355; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --bg2:#141C2C; --surface:#1A2334; --surface2:#222C41; --text:#EFE8DA; --text2:#AFA99D;
  --accent:#CBA863; --accentSoft:#3A3322; --navy:#2C3F63; --positive:#6FBF94; --warning:#E0A458;
  --disabled:#5C5A56; --divider:#2C3548; --locked:#6D6C69; --sea:#0F2230; --land:#3A3326; --country:#4A3F2C;
  --border:#A88A55; --mount:#8E7355; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
.screen.map-screen.active{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 6px;min-height:52px}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--divider);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pad{padding:4px 18px 28px}
.card{background:var(--surface);border:1px solid var(--divider);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.muted{color:var(--text2)}
.small{font-size:15px}
.xs{font-size:13.5px}
.section-title{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--text2);margin:0 0 6px}
/* ---------- Zikr ---------- */
.zikr-text{text-align:center;padding:22px 16px 18px}
.arabic{font-family:var(--arabic);direction:rtl;font-size:clamp(38px,11vw,50px);line-height:1.5;margin:0}
.translit{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--accent);margin:2px 0 0}
.translation{margin:6px 0 0;color:var(--text2)}
.counter{text-align:center;margin-top:18px}
.counter .num{font-family:var(--serif);font-weight:600;font-size:clamp(54px,17vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.counter .cap{font-size:14px;color:var(--text2);margin-top:4px}
.zikr-btn-wrap{display:grid;place-items:center;margin:22px 0 18px}
.zikr-btn{position:relative;width:min(58vw,210px);aspect-ratio:1;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#2E4470,#18263F 70%);color:#fff;box-shadow:0 14px 30px rgba(15,21,34,.35);display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .12s ease}
.zikr-btn::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #C2A05A}
.zikr-btn:active{transform:scale(.965);filter:brightness(1.08)}
.zikr-btn .inner{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:17px;padding:20px;text-align:center}
.zikr-btn .inner span{font-family:var(--arabic);font-weight:400;font-size:26px;line-height:1.1;color:#E3C274}
.ripple{position:absolute;inset:0;border-radius:50%;border:2px solid #C2A05A;opacity:.6;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1.18);opacity:0}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--divider);background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px}
.btn svg{width:19px;height:19px}
.btn:disabled{color:var(--disabled);cursor:default}
.btn.primary{background:var(--navy);color:#fff;border-color:#C2A05A88}
.btn.danger{color:#B3261E}
.btn.full{width:100%}
.stats{display:flex;justify-content:space-between;align-items:flex-end}
.big{font-family:var(--serif);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:8px;background:var(--accentSoft);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s ease}
.note{text-align:center;font-size:14px;color:var(--text2);margin-top:18px}
/* banner */
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;background:var(--surface2);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:12px 8px 12px 14px;display:flex;gap:12px;align-items:flex-start;animation:drop .3s ease}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.banner .ico{width:34px;height:34px;border-radius:50%;background:var(--accentSoft);display:grid;place-items:center;color:var(--accent);flex:none}
.banner .ttl{font-size:14px;color:var(--text2)}
.banner .hd{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.25}
.chip-btn{margin-top:8px;border:none;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px;min-height:40px}
/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--divider);background:var(--surface);padding-bottom:0}
.tab{border:none;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--text2);min-height:54px}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
/* map */
.map-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--sea);touch-action:none}
.map-wrap.city{background:var(--bg2)}
.map-wrap svg.world{width:100%;height:100%;display:block}
canvas.city{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.overlay>*{pointer-events:auto}
.mchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--divider);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;max-width:100%}
.disclaimer{font-size:12.5px;line-height:1.3;color:var(--text2);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px;padding:6px 10px;border:1px solid var(--divider);max-width:62%}
.ctrls{display:flex;flex-direction:column;gap:10px}
.ctrls .icon-btn{width:46px;height:46px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.bottomrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.citybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--divider);border-radius:18px;padding:14px 16px 16px;box-shadow:var(--shadow);animation:rise .28s ease}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.panel h2{font-family:var(--serif);font-size:24px;margin:0}
.panel .ar{font-family:var(--arabic);font-size:22px;color:var(--text2);direction:rtl;text-align:left}
.preview-badge{align-self:flex-start;background:var(--warning);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;margin-top:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .26s ease}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--divider);margin:0 auto 12px}
.hp-head{display:flex;gap:14px;align-items:flex-start}
.glyph{width:56px;height:56px;border-radius:14px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;flex:none}
.glyph svg{width:28px;height:28px}
.kicker{font-size:14px;color:var(--text2);font-weight:500}
.hp-title{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.2;margin:2px 0 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid currentColor}
.badge.warn{color:var(--warning);background:color-mix(in srgb,var(--warning) 10%,transparent)}
.badge.grey{color:var(--text2)}
.demo{display:flex;gap:10px;align-items:flex-start;color:var(--warning);background:color-mix(in srgb,var(--warning) 10%,transparent);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
details summary{cursor:pointer;font-family:var(--serif);font-weight:600;font-size:18px;min-height:44px;display:flex;align-items:center}
.src{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
/* lists */
.list{background:var(--surface);border:1px solid var(--divider);border-radius:16px;overflow:hidden}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--divider);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;min-height:48px}
.li:first-child{border-top:none}
.li .ic{width:26px;flex:none;color:var(--accent);padding-top:1px}
.li .ic.lock{color:var(--locked)}
.li .ic svg{width:22px;height:22px}
.newb{display:inline-block;background:var(--accentSoft);border-radius:999px;padding:1px 8px;font-size:12.5px;font-weight:700;margin-left:6px;vertical-align:2px}
.group-h{font-family:var(--serif);font-weight:600;font-size:19px;margin:22px 4px 8px}
.foot{font-size:14px;color:var(--text2);margin:8px 4px 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--divider);min-height:52px}
.switch:first-child{border-top:none}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:31px;background:var(--divider);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle input:checked+span{background:var(--positive)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:36px;border-radius:10px;border:1px solid var(--divider);background:var(--surface2);font-weight:700}
/* onboarding */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.onb .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 30px;gap:14px}
.onb h2{font-family:var(--serif);font-size:28px;margin:0}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--divider)}
.dots i.on{background:var(--accent)}
.dialog{position:fixed;inset:0;z-index:90;background:rgba(10,14,22,.5);display:grid;place-items:center;padding:24px}
.dialog .box{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%}
.dialog h3{font-family:var(--serif);margin:0 0 8px;font-size:21px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.reduced *,.reduced *::before,.reduced *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}

.kicker{font-size:13.5px;color:var(--text2);font-weight:500}
.ch-title{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25;margin-top:2px}
.ar-name{font-family:var(--arabic);font-size:22px;direction:rtl;text-align:left;color:var(--text2);margin:0 0 6px}
.badge{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sira{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:14px;padding:12px 14px}
.sira p{margin:4px 0 0;font-size:17px}
.sira.locked{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-color:var(--divider);color:var(--text2);font-size:15px}
.demo{color:var(--text2);background:var(--bg2);font-weight:500}
.timeline{position:relative;margin:18px 0 10px;padding-left:4px}
.timeline::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--divider)}
.tl{position:relative;display:flex;gap:14px;padding:8px 0}
.tl .dot{position:relative;z-index:1;flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface);border:2px solid var(--divider);color:var(--text2)}
.tl.on .dot{background:#C9A24D;border-color:#C9A24D;color:#1B2A44}
.tl-body{flex:1;background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:10px 12px}
.tl.on .tl-body{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tl-title{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.25}
.tl:not(.on) .tl-title{color:var(--text2)}
.chip-btn{margin-top:0}
.chip-btn.ghost{background:transparent;color:var(--text);border:1px solid var(--divider)}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pad .langs{justify-content:flex-start}
.lang{border:1px solid var(--divider);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500}
.lang.on{background:var(--navy);color:#fff;border-color:#C2A05A}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row3 .btn{flex-direction:column;gap:3px;padding:8px 6px;font-size:14.5px;min-height:60px}
.row3 .btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lvl-row{display:flex;gap:12px;align-items:center}
.lvl-badge{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#E3C274;font-family:var(--serif);font-weight:700;font-size:18px;border:2px solid #C2A05A}
.lvl-scale{display:flex;justify-content:space-between;margin:-2px 0 4px;font-variant-numeric:tabular-nums}
.next-ch{display:flex;flex-direction:column;gap:1px;margin-top:10px;padding-top:10px;border-top:1px solid var(--divider)}
.next-ch span:nth-child(2){font-family:var(--serif);font-weight:600;font-size:17px}
.lvl-head{display:flex;gap:12px;align-items:center;margin:24px 0 2px;padding:10px 12px;border-radius:14px;background:var(--bg2)}
.lvl-head .lvl-badge{width:34px;height:34px;font-size:16px;background:var(--surface);color:var(--text2);border-color:var(--divider)}
.lvl-head.active .lvl-badge{background:var(--navy);color:#E3C274;border-color:#C2A05A}
.lvl-head.done .lvl-badge{background:#C9A24D;color:#1B2A44;border-color:#C9A24D}
.lvl-head .kicker{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--text)}
.timeline{margin-top:6px}
/* ---- auth ---- */
.auth-provider{width:100%;min-height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;margin:8px 0}
.auth-provider.apple{background:#000;color:#fff;border:none}
.auth-provider.google{background:#fff;color:#202124;border:1px solid #dadce0;font-family:system-ui}
.auth-provider:disabled{opacity:.5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .auth-provider.google{background:#2d2e30;color:#e8eaed;border-color:#5f6368}}
:root[data-theme="dark"] .auth-provider.google{background:#2d2e30;color:#e8eaed;border-color:#5f6368}
.auth-user{font-size:17px;margin:14px 0 10px}.auth-provider-badge{font-size:15px;color:var(--text2)}
.auth-loading,.auth-error{padding:12px;border-radius:12px;margin:12px 0}.auth-loading{color:var(--text2)}.auth-error{border:1px solid var(--warning);color:var(--warning)}
</style>
</head>
<body>
<div class="app" id="app">
  <main id="screens" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <section class="screen active" id="s-zikr" aria-label="Зикр"></section>
    <section class="screen map-screen" id="s-map" aria-label="Карта"></section>
    <section class="screen" id="s-path" aria-label="Путь Сиры"></section>
    <section class="screen" id="s-info" aria-label="Информация"></section>
    <section class="screen" id="s-settings" aria-label="Настройки"></section>
  </main>
  <nav class="tabbar" id="tabbar" role="tablist"></nav>
  <div id="banner-host"></div>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
const LANGS = [["ru", "Русский", "ru-RU"], ["en", "English", "en-US"], ["uz", "O‘zbekcha", "uz-Latn-UZ"], ["tg", "Тоҷикӣ", "tg-TJ"], ["kk", "Қазақша", "kk-KZ"], ["ky", "Кыргызча", "ky-KG"]];
const UI = {
ru: {
  "tab.zikr": "Зикр", "tab.map": "Карта", "tab.path": "Путь Сиры", "tab.info": "Инфо", "tab.settings": "Настройки",
  "zikr.translation": "«Прошу у Аллаха прощения»", "zikr.button": "Нажмите для зикра", "zikr.total": "всего повторений",
  "zikr.correct": "Исправить", "zikr.map": "Карта", "zikr.today": "Сегодня", "zikr.todayCap": "повторений сегодня",
  "zikr.session": "за сеанс", "zikr.goal": "Личная цель: %1 из %2", "zikr.history": "История по дням",
  "zikr.note": "Счётчик — лишь личная запись и способ идти по пути Сиры. Это не мера духовной ценности.",

  sig: { ru: "Камень в восточном углу Каабы, от которого начинают обход — таваф.", en: "The stone in the eastern corner of the Kaaba where the circuit (tawaf) begins.", uz: "Ka’baning sharqiy burchagidagi tosh; tavof shu yerdan boshlanadi.", tg: "Санге дар кунҷи шарқии Каъба, ки тавоф аз он оғоз мешавад.", kk: "Қағбаның шығыс бұрышындағы тас, тауап осы жерден басталады.", ky: "Кааба чыгыш бурчундагы таш, тавап ушул жерден башталат." },
  look: { ru: "Тёмный камень с красноватым оттенком в простой серебряной оправе, вмурованный в угол на высоте около 1,5 м.", en: "A dark stone with a reddish tint in a simple silver setting, set into the corner about 1.5 m high.", uz: "Qizg‘ish tovlanadigan qora tosh, oddiy kumush gardishda, burchakka taxminan 1,5 m balandlikda o‘rnatilgan.", tg: "Санги торик бо тобиши сурхчатоб дар ҳалқаи оддии нуқрагин, дар баландии тақрибан 1,5 м ба кунҷ шинонда шуда.", kk: "Қызғылт реңді қара тас, қарапайым күміс жиекте, бұрышқа шамамен 1,5 м биіктікте орнатылған.", ky: "Кызгылт өңдүү кара таш, жөнөкөй күмүш алкакта, бурчка болжол менен 1,5 м бийиктикте орнотулган." },
  sira: { ru: "Когда курайшиты перестраивали Каабу (605 г.), племена спорили, кто установит камень. Пророк ﷺ, ещё до начала пророчества, предложил положить его на плащ, чтобы все племена подняли его вместе, и сам установил камень на место.", en: "When the Quraysh rebuilt the Kaaba (605), the clans disputed who would set the stone. Before his prophethood, the Prophet ﷺ had it placed on a cloak so all clans lifted it together, and set it in place himself.", uz: "Quraysh Ka’bani qayta qurayotganda (605) qabilalar toshni kim o‘rnatishi haqida bahslashdi. Payg‘ambarlikdan oldin Rasululloh ﷺ uni yopinchiqqa qo‘yib, barcha qabilalar birga ko‘tarishini taklif qildi va toshni o‘zi o‘rnatdi.", tg: "Ҳангоми бозсозии Каъба (605) қабилаҳо баҳс карданд, ки сангро кӣ гузорад. Паёмбар ﷺ ҳанӯз пеш аз паёмбарӣ пешниҳод кард, ки онро бар ридо гузоранд, то ҳамаи қабилаҳо якҷоя бардоранд, ва худ сангро ба ҷояш гузошт.", kk: "Құрайыш Қағбаны қайта салғанда (605) рулар тасты кім орнататыны туралы таласты. Пайғамбарлыққа дейін ол ﷺ тасты шапанға салып, барлық рулар бірге көтеруін ұсынды да, өзі орнына қойды.", ky: "Курайш Каабаны кайра курганда (605) уруулар ташты ким орнотору боюнча талашты. Пайгамбарлыкка чейин ал ﷺ ташты чапанга коюп, бардык уруулар чогуу көтөрүүсүн сунуштап, өзү ордуна койду." } },
maqam: { ar: "مقام إبراهيم", city: "mecca", cat: "sacred",
  name: { ru: "Макам Ибрахим", en: "Maqam Ibrahim", uz: "Maqomi Ibrohim", tg: "Мақоми Иброҳим", kk: "Мақам Ибраһим", ky: "Макам Ибрахим" },
  sig: { ru: "Камень, на котором стоял пророк Ибрахим при строительстве Каабы.", en: "The stone on which the prophet Ibrahim (Abraham) stood while building the Kaaba.", uz: "Ibrohim alayhissalom Ka’bani qurishda ustida turgan tosh.", tg: "Санге, ки Иброҳим (а) ҳангоми сохтани Каъба бар он истода буд.", kk: "Ибраһим пайғамбар Қағбаны салғанда үстінде тұрған тас.", ky: "Ибрахим пайгамбар Каабаны курууда үстүндө турган таш." },
  look: { ru: "Небольшой светлый камень со следами стоп; стоял под открытым небом у стены Каабы, без навесов.", en: "A small light-coloured stone bearing footprints; it stood in the open by the Kaaba’s wall, without any canopy.", uz: "Oyoq izlari qolgan kichik och rangli tosh; Ka’ba devori yonida ochiq osmon ostida, soyabonsiz turgan.", tg: "Санги хурди равшан бо нақши пойҳо; дар назди девори Каъба зери осмони кушод, бе соябон меистод.", kk: "Табан іздері қалған шағын ақшыл тас; Қағба қабырғасының жанында ашық аспан астында, күнқағарсыз тұрған.", ky: "Таман издери калган кичинекей ачык түстөгү таш; Кааба дубалынын жанында ачык асман астында, күн калкасыз турган." },
  sira: { ru: "Пророк ﷺ совершал молитву у Макама после обхода Каабы, исполняя повеление Корана (2:125).", en: "The Prophet ﷺ prayed at the Maqam after the circuit of the Kaaba, following the command of the Qur’an (2:125).", uz: "Payg‘ambar ﷺ Qur’on amriga (2:125) ko‘ra tavofdan so‘ng Maqom ortida namoz o‘qirdi.", tg: "Паёмбар ﷺ пас аз тавоф, ба фармони Қуръон (2:125), назди Мақом намоз мегузошт.", kk: "Пайғамбар ﷺ Құран бұйрығы бойынша (2:125) тауаптан соң Мақамның артында намаз оқыды.", ky: "Пайгамбар ﷺ Куран буйругу боюнча (2:125) таваптан кийин Макамдын артында намаз окучу." } },
zamzam: { ar: "بئر زمزم", city: "mecca", cat: "sacred",
  name: { ru: "Колодец Замзам", en: "The Zamzam well", uz: "Zamzam qudug‘i", tg: "Чоҳи Замзам", kk: "Зәмзәм құдығы", ky: "Замзам кудугу" },
  sig: { ru: "Источник воды, благодаря которому в долине возникла и жила Мекка.", en: "The water source that allowed Mecca to arise and live in the valley.", uz: "Vodiyda Makkaning paydo bo‘lishi va yashashiga sabab bo‘lgan suv manbai.", tg: "Сарчашмае, ки ба шарофати он Макка дар водӣ пайдо шуд ва зист.", kk: "Аңғарда Меккенің пайда болып, өмір сүруіне себеп болған су көзі.", ky: "Өрөөндө Меккенин пайда болушуна жана жашашына себеп болгон суу булагы." },
  look: { ru: "Простая шахта, обложенная по краю необработанным камнем, с низким каменным ограждением — без куполов и построек.", en: "A simple shaft lined at the rim with rough stone, with a low stone parapet — no domes or buildings.", uz: "Cheti ishlov berilmagan tosh bilan o‘ralgan oddiy quduq, past tosh to‘siq bilan — gumbaz va binolarsiz.", tg: "Чоҳи оддӣ, ки канорааш бо санги коркарднашуда фаро гирифта шуда, бо девораи пасти сангин — бе гунбаз ва бино.", kk: "Шеті өңделмеген таспен қапталған қарапайым шахта, аласа тас қоршауы бар — күмбезсіз, құрылыссыз.", ky: "Чети иштелбеген таш менен капталган жөнөкөй шахта, жапыз таш тосмосу бар — күмбөзсүз, курулушсуз." },
  sira: { ru: "Пророк ﷺ и его сподвижники пили эту воду и совершали ею омовение на протяжении всей жизни.", en: "The Prophet ﷺ and his companions drank this water and used it for ablution throughout their lives.", uz: "Payg‘ambar ﷺ va sahobalar butun umr bu suvdan ichgan va tahorat olgan.", tg: "Паёмбар ﷺ ва саҳобагон дар тӯли умр аз ин об менӯшиданд ва таҳорат мегирифтанд.", kk: "Пайғамбар ﷺ мен сахабалар өмір бойы осы судан ішіп, дәрет алған.", ky: "Пайгамбар ﷺ жана сахабалар өмүр бою ушул суудан ичип, даарат алышкан." } },
safamarwa: { ar: "الصفا والمروة", city: "mecca", cat: "sacred",
  name: { ru: "Холмы Сафа и Марва", en: "Safa and Marwa", uz: "Safo va Marva", tg: "Сафо ва Марва", kk: "Сафа мен Мәруа", ky: "Сафа жана Марва" },
  sig: { ru: "Два холма, между которыми совершается сай — ритуальный проход во время хаджа и умры.", en: "Two hills between which the sa‘y — the ritual walk of hajj and umrah — is performed.", uz: "Haj va umrada sa’y — marosimiy yurish — ado etiladigan ikki tepalik.", tg: "Ду теппа, ки миёни онҳо саъй — гузари маросимии ҳаҷ ва умра — адо мешавад.", kk: "Қажылық пен ұмрада сағи — рәсімдік жүріс — жасалатын екі төбе.", ky: "Ажылык жана умрада саъй — ырым-жырымдык жүрүш — аткарылуучу эки дөбө." },
  look: { ru: "Скальные выступы серого гранита: Сафа выше и круче, Марва — пологая. Между ними шла обычная торговая улица с домами.", en: "Outcrops of grey granite: Safa higher and steeper, Marwa gentler. An ordinary market street with houses ran between them.", uz: "Kulrang granit qoyalari: Safo balandroq va tikroq, Marva — qiyaroq. Ular orasida uylar bilan oddiy savdo ko‘chasi bo‘lgan.", tg: "Сахраҳои гранити хокистарӣ: Сафо баландтар ва нишебтар, Марва ҳамвортар. Миёнашон кӯчаи оддии тиҷоратӣ бо хонаҳо мегузашт.", kk: "Сұр граниттің жартастары: Сафа биігірек әрі тік, Мәруа — жайпақ. Олардың арасында үйлері бар қарапайым сауда көшесі жатты.", ky: "Боз граниттин аскалары: Сафа бийигирээк жана тик, Марва — жантайма. Алардын ортосунда үйлөрү бар жөнөкөй соода көчөсү өткөн." },
  sira: { ru: "Поднявшись на Сафу, Пророк ﷺ впервые открыто призвал курайшитов к единобожию.", en: "Standing on Safa, the Prophet ﷺ first openly called the Quraysh to monotheism.", uz: "Safoga chiqib, Payg‘ambar ﷺ ilk bor Qurayshni ochiqchasiga tavhidga da’vat qildi.", tg: "Паёмбар ﷺ бар Сафо баромада, бори аввал Қурайшро ошкоро ба тавҳид даъват кард.", kk: "Пайғамбар ﷺ Сафаға шығып, құрайыштарды алғаш рет ашық таухидке шақырды.", ky: "Пайгамбар ﷺ Сафага чыгып, курайштарды биринчи жолу ачык таухидге чакырды." } },
khadija: { ar: "دار خديجة", city: "mecca", cat: "sira",
  name: { ru: "Дом Хадиджи", en: "House of Khadija", uz: "Xadicha uyi", tg: "Хонаи Хадиҷа", kk: "Хадишаның үйі", ky: "Хадыйчанын үйү" },
  sig: { ru: "Дом Пророка ﷺ и Хадиджи. Сегодня не сохранился, место застроено.", en: "The home of the Prophet ﷺ and Khadija. It no longer survives; the site is built over.", uz: "Payg‘ambar ﷺ va Xadichaning uyi. Bugun saqlanmagan, joyi qurib yuborilgan.", tg: "Хонаи Паёмбар ﷺ ва Хадиҷа. Имрӯз боқӣ намондааст, ҷояш сохта шудааст.", kk: "Пайғамбар ﷺ мен Хадишаның үйі. Бүгінде сақталмаған, орны салынып кеткен.", ky: "Пайгамбар ﷺ менен Хадыйчанын үйү. Бүгүн сакталган эмес, орду курулуп кеткен." },
  look: { ru: "Мекканский дом из камня и сырцового кирпича: открытый внутренний двор, жилые комнаты, комната для молитвы и хозяйственные пристройки.", en: "A Meccan house of stone and mud brick: an open inner courtyard, living rooms, a prayer room and outbuildings.", uz: "Tosh va xom g‘ishtdan qurilgan Makka uyi: ochiq ichki hovli, yashash xonalari, namozxona va xo‘jalik xonalari.", tg: "Хонаи маккагӣ аз санг ва хишти хом: ҳавлии дарунии кушод, утоқҳои зист, утоқи намоз ва иморатҳои хоҷагӣ.", kk: "Тас пен кесектен салынған Мекке үйі: ашық ішкі аула, тұрғын бөлмелер, намаз бөлмесі және шаруашылық қосалқылары.", ky: "Таш жана кыштан салынган Мекке үйү: ачык ички короо, турак бөлмөлөр, намаз бөлмөсү жана чарба имараттары." },
  sira: { ru: "Здесь Пророк ﷺ прожил около 28 лет; здесь родились почти все его дети и прошли первые годы пророческой миссии.", en: "The Prophet ﷺ lived here for about 28 years; almost all his children were born here and his mission began here.", uz: "Payg‘ambar ﷺ bu yerda qariyb 28 yil yashadi; deyarli barcha farzandlari shu yerda tug‘ildi va payg‘ambarlik vazifasi boshlandi.", tg: "Паёмбар ﷺ дар ин ҷо қариб 28 сол зист; қариб ҳамаи фарзандонаш дар ин ҷо таваллуд шуданд ва рисолаташ оғоз ёфт.", kk: "Пайғамбар ﷺ мұнда 28 жылдай тұрды; балаларының барлығына жуығы осында туылып, пайғамбарлық миссиясы басталды.", ky: "Пайгамбар ﷺ бул жерде 28 жылдай жашады; балдарынын дээрлик баары ушул жерде төрөлүп, пайгамбарлык миссиясы башталган." } },
arqam: { ar: "دار الأرقم", city: "mecca", cat: "sira",
  name: { ru: "Дом аль-Аркама", en: "House of al-Arqam", uz: "Al-Arqam uyi", tg: "Хонаи Арқам", kk: "Әл-Арқам үйі", ky: "Аль-Аркамдын үйү" },
  sig: { ru: "Место тайных собраний первых мусульман у подножия холма Сафа.", en: "The secret meeting place of the first Muslims at the foot of Safa.", uz: "Safo tepaligi etagida ilk musulmonlarning yashirin yig‘ilish joyi.", tg: "Ҷойи ҷамъомадҳои пинҳонии мусулмонони аввал дар доманаи Сафо.", kk: "Сафа төбесінің етегіндегі алғашқы мұсылмандардың жасырын жиналатын орны.", ky: "Сафа дөбөсүнүн этегиндеги алгачкы мусулмандардын жашыруун чогулуучу жери." },
  look: { ru: "Небольшой каменный дом с плоской крышей и узкими окнами, откуда были видны Кааба и подступы к Сафе.", en: "A small stone house with a flat roof and narrow windows overlooking the Kaaba and the approaches to Safa.", uz: "Tekis tomli, tor derazali kichik tosh uy; undan Ka’ba va Safoga yo‘llar ko‘rinib turgan.", tg: "Хонаи хурди сангин бо боми ҳамвор ва тирезаҳои танг, ки аз он Каъба ва роҳҳои Сафо намоён буданд.", kk: "Жалпақ шатырлы, тар терезелі шағын тас үй; одан Қағба мен Сафаға апаратын жолдар көрінетін.", ky: "Жалпак чатырлуу, тар терезелүү кичинекей таш үй; андан Кааба жана Сафага баруучу жолдор көрүнчү." },
  sira: { ru: "В ранний мекканский период здесь собиралась и училась первая община мусульман.", en: "In the early Meccan period the first Muslim community gathered and studied here.", uz: "Makka davrining boshida ilk musulmon jamoasi shu yerda yig‘ilib, ta’lim olgan.", tg: "Дар давраи аввали Макка ҷамъияти нахустини мусулмонон дар ин ҷо ҷамъ омада, таълим мегирифт.", kk: "Мекке кезеңінің басында алғашқы мұсылман қауымы осында жиналып, білім алған.", ky: "Мекке мезгилинин башында алгачкы мусулман жамааты ушул жерде чогулуп, билим алган." } },
hira: { ar: "غار حراء", city: "mecca", cat: "sira",
  name: { ru: "Пещера Хира (гора ан-Нур)", en: "Cave of Hira (Jabal al-Nour)", uz: "Hiro g‘ori (Nur tog‘i)", tg: "Ғори Ҳиро (кӯҳи Нур)", kk: "Хира үңгірі (Нұр тауы)", ky: "Хира үңкүрү (Нур тоосу)" },
  sig: { ru: "Место уединения и размышлений Пророка ﷺ на горе Джабаль ан-Нур.", en: "The Prophet’s ﷺ place of seclusion and reflection on Jabal al-Nour.", uz: "Nur tog‘idagi Payg‘ambar ﷺ xilvat va tafakkur qilgan joy.", tg: "Ҷойи хилват ва тафаккури Паёмбар ﷺ дар кӯҳи Нур.", kk: "Нұр тауындағы Пайғамбардың ﷺ оңашаланып, ойға шомылған орны.", ky: "Нур тоосундагы Пайгамбардын ﷺ жалгыз калып ой жүгүрткөн жери." },
  look: { ru: "Узкая природная расщелина в скалах длиной около 3,5 м и шириной около 1,5 м; внутри помещаются один-два человека.", en: "A narrow natural cleft in the rock about 3.5 m long and 1.5 m wide; it holds one or two people.", uz: "Uzunligi 3,5 m, eni 1,5 m ga yaqin tor tabiiy yoriq; ichiga bir-ikki kishi sig‘adi.", tg: "Шикофи танги табиӣ дар сахра, дарозиаш тақрибан 3,5 м ва паҳнояш 1,5 м; як-ду нафар мегунҷад.", kk: "Ұзындығы шамамен 3,5 м, ені 1,5 м тар табиғи жарық; ішіне бір-екі адам сыяды.", ky: "Узундугу 3,5 м, туурасы 1,5 мге жакын тар табигый жарака; ичине бир-эки киши батат." },
  sira: { ru: "Около 610 года здесь Пророку ﷺ явился ангел Джибрил и были ниспосланы первые аяты Корана — начало суры «Аль-Алак».", en: "Around 610 the angel Jibril came to the Prophet ﷺ here and the first verses of the Qur’an were revealed — the opening of Surah al-‘Alaq.", uz: "Taxminan 610-yilda bu yerda Payg‘ambarga ﷺ Jabroil farishta keldi va Qur’onning ilk oyatlari — «Alaq» surasining boshi nozil bo‘ldi.", tg: "Тақрибан соли 610 дар ин ҷо ба Паёмбар ﷺ фариштаи Ҷабраил омад ва оятҳои нахустини Қуръон — ибтидои сураи «Алақ» нозил шуд.", kk: "Шамамен 610 жылы мұнда Пайғамбарға ﷺ Жәбірейіл періште келіп, Құранның алғашқы аяттары — «Ғалақ» сүресінің басы түсірілді.", ky: "Болжол менен 610-жылы бул жерде Пайгамбарга ﷺ Жебирейил периште келип, Курандын алгачкы аяттары — «Алак» сүрөсүнүн башы түшүрүлгөн." } },
thawr: { ar: "غار ثور", city: "mecca", cat: "sira",
  name: { ru: "Пещера Саур", en: "Cave of Thawr", uz: "Savr g‘ori", tg: "Ғори Савр", kk: "Саур үңгірі", ky: "Саур үңкүрү" },
  sig: { ru: "Убежище на горе Саур к югу от Мекки.", en: "A refuge on Mount Thawr, south of Mecca.", uz: "Makkaning janubidagi Savr tog‘idagi panoh.", tg: "Паноҳгоҳ дар кӯҳи Савр дар ҷануби Макка.", kk: "Меккенің оңтүстігіндегі Саур тауындағы пана.", ky: "Мекенин түштүгүндөгү Саур тоосундагы баш калкалоочу жай." },
  look: { ru: "Небольшая пещера с двумя узкими низкими входами; высота свода — около 1,2–1,5 м.", en: "A small cave with two narrow, low entrances; the ceiling is about 1.2–1.5 m high.", uz: "Ikki tor va past kirishli kichik g‘or; shipi 1,2–1,5 m atrofida.", tg: "Ғори хурд бо ду даромадгоҳи танги паст; баландии шифташ тақрибан 1,2–1,5 м.", kk: "Екі тар әрі аласа кіреберісі бар шағын үңгір; төбесінің биіктігі шамамен 1,2–1,5 м.", ky: "Эки тар жана жапыз кире бериши бар кичинекей үңкүр; шыбынын бийиктиги 1,2–1,5 мдей." },
  sira: { ru: "Во время хиджры в 622 году Пророк ﷺ и Абу Бакр три дня укрывались здесь от преследователей.", en: "During the Hijra in 622 the Prophet ﷺ and Abu Bakr hid here from their pursuers for three days.", uz: "622-yilgi hijrat chog‘ida Payg‘ambar ﷺ va Abu Bakr ta’qibchilardan uch kun shu yerda yashirindi.", tg: "Ҳангоми ҳиҷрат дар соли 622 Паёмбар ﷺ ва Абӯбакр се рӯз дар ин ҷо аз таъқибкунандагон пинҳон шуданд.", kk: "622 жылғы һижра кезінде Пайғамбар ﷺ мен Әбу Бәкір қуғыншылардан үш күн осында жасырынды.", ky: "622-жылкы хижрат учурунда Пайгамбар ﷺ жана Абу Бакр куугунчулардан үч күн ушул жерде жашынышкан." } },
nabawi: { ar: "المسجد النبوي", city: "medina", cat: "mosque",
  name: { ru: "Мечеть Пророка ﷺ", en: "The Prophet’s ﷺ Mosque", uz: "Payg‘ambar ﷺ masjidi", tg: "Масҷиди Паёмбар ﷺ", kk: "Пайғамбар ﷺ мешіті", ky: "Пайгамбар ﷺ мечити" },
  sig: { ru: "Религиозный и общественный центр Медины времён Пророка ﷺ.", en: "The religious and civic centre of Medina in the Prophet’s ﷺ time.", uz: "Payg‘ambar ﷺ davrida Madinaning diniy va ijtimoiy markazi.", tg: "Маркази динӣ ва ҷамъиятии Мадина дар замони Паёмбар ﷺ.", kk: "Пайғамбар ﷺ заманындағы Мединенің діни және қоғамдық орталығы.", ky: "Пайгамбар ﷺ доорундагы Мединанын диний жана коомдук борбору." },
  look: { ru: "Двор около 30×35 м со стенами из необожжённого кирпича на каменном фундаменте. Опоры — стволы финиковых пальм, кровля — из пальмовых ветвей и глины. С востока примыкали комнаты (худжраты) жён Пророка ﷺ.", en: "A courtyard of about 30×35 m with mud-brick walls on a stone base. Palm trunks served as pillars; the roof was of palm fronds and clay. The rooms (hujurat) of the Prophet’s ﷺ wives adjoined it on the east.", uz: "Tosh poydevordagi xom g‘isht devorli, taxminan 30×35 m hovli. Ustunlar — xurmo tanalari, tomi — xurmo shoxlari va loydan. Sharq tomonda Payg‘ambar ﷺ ayollarining hujralari bor edi.", tg: "Ҳавлии тақрибан 30×35 м бо деворҳои хишти хом бар таҳкурсии сангин. Сутунҳо — танаҳои нахл, бом — аз шохаҳои нахл ва гил. Аз шарқ ҳуҷраҳои занони Паёмбар ﷺ пайваст буданд.", kk: "Тас іргетасқа қаланған кесек қабырғалы, шамамен 30×35 м аула. Тіректері — құрма діңдері, шатыры — құрма бұтақтары мен балшықтан. Шығысында Пайғамбар ﷺ әйелдерінің бөлмелері (хужралар) тұрды.", ky: "Таш пайдубалдагы кыш дубалдуу, болжол менен 30×35 м короо. Тирөөчтөрү — курма сөңгөктөрү, чатыры — курма бутактарынан жана ылайдан. Чыгышында Пайгамбардын ﷺ аялдарынын бөлмөлөрү (хужралар) турган." },
  sira: { ru: "Мечеть заложена Пророком ﷺ сразу после хиджры в 622 году; он сам участвовал в строительстве.", en: "The Prophet ﷺ founded the mosque right after the Hijra in 622 and took part in building it himself.", uz: "Masjidga Payg‘ambar ﷺ 622-yilda hijratdan so‘ng darhol asos soldi va qurilishda o‘zi qatnashdi.", tg: "Масҷидро Паёмбар ﷺ фавран пас аз ҳиҷрат дар соли 622 бунёд гузошт ва худ дар сохтмон ширкат кард.", kk: "Мешіттің іргетасын Пайғамбар ﷺ 622 жылы һижрадан кейін бірден қалап, құрылысқа өзі қатысты.", ky: "Мечиттин пайдубалын Пайгамбар ﷺ 622-жылы хижраттан кийин дароо түптөп, курулушка өзү катышкан." } },
baqi: { ar: "البقيع", city: "medina", cat: "memorial",
  name: { ru: "Аль-Баки", en: "Al-Baqi", uz: "Al-Baqi’", tg: "Ал-Бақеъ", kk: "Әл-Бақиъ", ky: "Аль-Бакиъ" },
  sig: { ru: "Главное кладбище Медины к востоку от Мечети Пророка ﷺ.", en: "The main cemetery of Medina, east of the Prophet’s ﷺ Mosque.", uz: "Payg‘ambar ﷺ masjidining sharqidagi Madinaning asosiy qabristoni.", tg: "Қабристони асосии Мадина дар шарқи Масҷиди Паёмбар ﷺ.", kk: "Пайғамбар ﷺ мешітінің шығысындағы Мединенің басты зираты.", ky: "Пайгамбар ﷺ мечитинин чыгышындагы Мединанын башкы көрүстөнү." },
  look: { ru: "Открытая земля, поросшая колючим кустарником гаркад, без ограды; могилы отмечались простыми камнями.", en: "Open ground covered with thorny gharqad shrubs, unwalled; graves were marked with plain stones.", uz: "Tikanli g‘arqad butalari o‘sgan, to‘siqsiz ochiq yer; qabrlar oddiy toshlar bilan belgilangan.", tg: "Замини кушоди бе девор бо буттаҳои хордори ғарқад; қабрҳо бо сангҳои оддӣ нишона мешуданд.", kk: "Тікенді ғарқад бұталары өскен, қоршаусыз ашық жер; қабірлер қарапайым тастармен белгіленген.", ky: "Тикенектүү гаркад бадалдары өскөн, тосмосуз ачык жер; мүрзөлөр жөнөкөй таштар менен белгиленген." },
  sira: { ru: "Место захоронения, определённое Пророком ﷺ; здесь похоронены его сын Ибрахим, дочери и многие сподвижники.", en: "A burial ground designated by the Prophet ﷺ; his son Ibrahim, his daughters and many companions are buried here.", uz: "Payg‘ambar ﷺ belgilagan qabriston; bu yerda o‘g‘li Ibrohim, qizlari va ko‘plab sahobalar dafn etilgan.", tg: "Қабристоне, ки Паёмбар ﷺ муайян кард; писараш Иброҳим, духтаронаш ва бисёр саҳобагон дар ин ҷо дафн шудаанд.", kk: "Пайғамбар ﷺ белгілеген зират; мұнда ұлы Ибраһим, қыздары мен көптеген сахабалар жерленген.", ky: "Пайгамбар ﷺ белгилеген көрүстөн; бул жерде уулу Ибрахим, кыздары жана көптөгөн сахабалар коюлган." } },
quba: { ar: "مسجد قباء", city: "medina", cat: "mosque",
  name: { ru: "Мечеть Куба", en: "Quba Mosque", uz: "Quba masjidi", tg: "Масҷиди Қубо", kk: "Құба мешіті", ky: "Куба мечити" },
  sig: { ru: "Первая мечеть в истории ислама.", en: "The first mosque in the history of Islam.", uz: "Islom tarixidagi birinchi masjid.", tg: "Нахустин масҷид дар таърихи ислом.", kk: "Ислам тарихындағы алғашқы мешіт.", ky: "Ислам тарыхындагы биринчи мечит." },
  look: { ru: "Квадратное пространство, огороженное камнем; сначала без крыши, позже — навес на пальмовых столбах в южной части.", en: "A square space enclosed by stone; at first unroofed, later with a shade on palm posts along the south side.", uz: "Tosh bilan o‘ralgan kvadrat maydon; avval tomsiz, keyin janub tomonda xurmo ustunlaridagi soyabon qurilgan.", tg: "Фазои мураббаъ бо девори сангин; аввал бе бом, баъдтар дар қисми ҷанубӣ соябон бар сутунҳои нахл сохта шуд.", kk: "Таспен қоршалған шаршы алаң; алғашында шатырсыз, кейін оңтүстік жағында құрма бағаналарындағы күнқағар салынды.", ky: "Таш менен тосулган чарчы аянт; адегенде чатырсыз, кийин түштүк тарабында курма мамыларындагы күн калка тургузулган." },
  sira: { ru: "Построена Пророком ﷺ и сподвижниками во время остановки в Куба по пути в Медину в 622 году.", en: "Built by the Prophet ﷺ and his companions during their stop at Quba on the way to Medina in 622.", uz: "622-yilda Madinaga yo‘lda Qubada to‘xtaganda Payg‘ambar ﷺ va sahobalar tomonidan qurilgan.", tg: "Паёмбар ﷺ ва саҳобагон дар соли 622 ҳангоми таваққуф дар Қубо дар роҳи Мадина онро сохтанд.", kk: "622 жылы Мединеге бара жатып Құбада аялдаған кезде Пайғамбар ﷺ мен сахабалар салған.", ky: "622-жылы Мединага баратып Кубада токтогондо Пайгамбар ﷺ жана сахабалар курушкан." } },
qiblatayn: { ar: "مسجد القبلتين", city: "medina", cat: "mosque",
  name: { ru: "Мечеть аль-Кыблатайн", en: "Masjid al-Qiblatayn", uz: "Qiblatayn masjidi", tg: "Масҷиди Қиблатайн", kk: "Әл-Қыблатайн мешіті", ky: "Аль-Кыблатайн мечити" },
  sig: { ru: "«Мечеть двух кибл» — память о смене направления молитвы.", en: "“The Mosque of the Two Qiblas” — a memorial of the change in the direction of prayer.", uz: "«Ikki qibla masjidi» — namoz yo‘nalishi o‘zgargani xotirasi.", tg: "«Масҷиди ду қибла» — ёдгори тағйири самти намоз.", kk: "«Екі құбыла мешіті» — намаз бағытының өзгергенінің естелігі.", ky: "«Эки кыбыла мечити» — намаз багытынын өзгөргөнүнүн эстелиги." },
  look: { ru: "Простая мечеть из сырцового кирпича в квартале Бану Салима. Позднее в ней отмечали оба направления молитвы.", en: "A simple mud-brick mosque in the quarter of Banu Salima. Later both directions of prayer were marked in it.", uz: "Banu Salima mahallasidagi xom g‘ishtdan qurilgan oddiy masjid. Keyinchalik unda ikki namoz yo‘nalishi belgilangan.", tg: "Масҷиди оддии хишти хом дар маҳаллаи Бану Салима. Баъдтар дар он ҳарду самти намоз нишона шуданд.", kk: "Бану Сәлима мекеніндегі кесектен салынған қарапайым мешіт. Кейінірек онда намаздың екі бағыты да белгіленді.", ky: "Бану Салима кварталындагы кыштан салынган жөнөкөй мечит. Кийинчерээк анда намаздын эки багыты тең белгиленген." },
  sira: { ru: "По преданию, здесь во время молитвы Пророк ﷺ получил откровение о смене киблы с Иерусалима на Мекку (2 г. х., 624 г.).", en: "According to tradition, the Prophet ﷺ received here, during prayer, the revelation changing the qibla from Jerusalem to Mecca (2 AH, 624).", uz: "Rivoyatga ko‘ra, bu yerda namoz paytida Payg‘ambarga ﷺ qiblani Quddusdan Makkaga o‘zgartirish haqida vahiy keldi (hijriy 2, 624-yil).", tg: "Тибқи ривоят, дар ин ҷо ҳангоми намоз ба Паёмбар ﷺ ваҳйи тағйири қибла аз Қудс ба Макка нозил шуд (с. 2 ҳ., 624).", kk: "Риуаят бойынша, осында намаз үстінде Пайғамбарға ﷺ құбыланы Құдыстан Меккеге ауыстыру туралы уахи түсті (һ. 2 ж., 624).", ky: "Риваят боюнча, ушул жерде намаз учурунда Пайгамбарга ﷺ кыбыланы Куддустан Меккеге алмаштыруу тууралуу вахий түшкөн (х. 2-ж., 624)." } },
uhud: { ar: "جبل أحد", city: "medina", cat: "memorial",
  name: { ru: "Гора Ухуд", en: "Mount Uhud", uz: "Uhud tog‘i", tg: "Кӯҳи Уҳуд", kk: "Ұхуд тауы", ky: "Ухуд тоосу" },
  sig: { ru: "Гора к северу от Медины — место битвы и захоронения павших.", en: "A mountain north of Medina — the site of the battle and of the graves of the fallen.", uz: "Madinaning shimolidagi tog‘ — jang va shahidlar dafn etilgan joy.", tg: "Кӯҳе дар шимоли Мадина — ҷойи ҷанг ва дафни шаҳидон.", kk: "Мединенің солтүстігіндегі тау — шайқас және шейіттер жерленген орын.", ky: "Мединанын түндүгүндөгү тоо — салгылашуу жана шейиттер коюлган жер." },
  look: { ru: "Скальный хребет из красноватого гранита длиной около 7 км; у подножия — невысокий холм лучников и плато с могилами павших.", en: "A ridge of reddish granite about 7 km long; at its foot, a low archers’ hill and a plateau with the graves of the fallen.", uz: "Uzunligi 7 km ga yaqin qizg‘ish granit tizmasi; etagida past kamonchilar tepaligi va shahidlar qabrlari bor maydon.", tg: "Қаторкӯҳи гранити сурхчатоб бо дарозии тақрибан 7 км; дар доманааш теппаи пасти тирандозон ва ҳамворӣ бо қабрҳои шаҳидон.", kk: "Ұзындығы шамамен 7 км қызғылт граниттен тұратын жота; етегінде аласа садақшылар төбесі мен шейіттер қабірлері бар алаң.", ky: "Узундугу 7 кмдей кызгылт граниттен турган кырка тоо; этегинде жапыз жаачылар дөбөсү жана шейиттердин мүрзөлөрү бар түздүк." },
  sira: { ru: "В 625 году у горы произошла битва при Ухуде. Здесь похоронены павшие, среди них Хамза ибн Абд аль-Мутталиб.", en: "In 625 the Battle of Uhud took place by the mountain. The fallen are buried here, among them Hamza ibn Abd al-Muttalib.", uz: "625-yilda tog‘ yonida Uhud jangi bo‘ldi. Bu yerda shahidlar, jumladan Hamza ibn Abdulmuttalib dafn etilgan.", tg: "Соли 625 назди кӯҳ ҷанги Уҳуд рух дод. Шаҳидон, аз ҷумла Ҳамза ибни Абдулмутталиб, дар ин ҷо дафн шудаанд.", kk: "625 жылы тау түбінде Ұхуд шайқасы болды. Мұнда шейіттер, солардың ішінде Хамза ибн Абдулмұтталиб жерленген.", ky: "625-жылы тоонун этегинде Ухуд салгылашуусу болгон. Бул жерде шейиттер, алардын ичинде Хамза ибн Абдулмутталиб коюлган." } },
fath: { ar: "مسجد الفتح", city: "medina", cat: "sira",

let lastUnlockKey = {};
function openCity(id, focusId) {
  mapView.mode = "city"; mapView.city = id; mapView.selected = id; state.city = id; persist();
  if (currentTab !== "map") selectTab("map"); else renderMap();
  const city = buildCity(id);
  if (focusId) { const o = city.objects.find((q) => q.id === focusId); if (o) { city.selected = o.id; focusObject(city, o.id); } }
}
function renderCity() {
  const id = mapView.city, city = buildCity(id);
  const chs = CH.filter((x) => x.city === id), op = chs.filter((x) => isReallyOpen(x.id)).length;
  $("#s-map").innerHTML = `
    <div class="topbar"><button class="icon-btn" id="c-back" aria-label="${T("map.back")}">${icon("back")}</button><h1>${T("city." + id)}</h1>
      <div style="display:flex;gap:8px"><button class="icon-btn" id="c-list" aria-label="${T("map.list")}">${icon("list")}</button><button class="icon-btn" id="c-help" aria-label="${T("map.legend")}">${icon("help")}</button></div></div>
    <div class="map-wrap city" id="city-wrap"><canvas class="city" id="city-canvas" role="img" aria-label="${T("map.a11y")}"></canvas>
      <div class="overlay"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="mchip">${icon("star", 'style="width:16px;height:16px"')}${T("map.chapters", op, chs.length)}</span>
        ${state.settings.preview ? `<span class="preview-badge">${T("preview.badge")}</span>` : ""}</div>
        <div class="bottomrow"><div class="disclaimer">${T("map.disclaimer")}</div>
          <div class="ctrls"><button class="icon-btn" id="c-in" aria-label="${T("map.zoomIn")}">${icon("plus")}</button><button class="icon-btn" id="c-out" aria-label="${T("map.zoomOut")}">${icon("minus")}</button><button class="icon-btn" id="c-reset" aria-label="${T("map.reset")}">${icon("scope")}</button></div></div></div></div>`;
  const canvas = $("#city-canvas"); cctx = canvas.getContext("2d");
  const wrap = $("#city-wrap");
  const resize = () => { const r = wrap.getBoundingClientRect(); viewW = r.width; viewH = r.height; canvas.width = Math.round(viewW * DPR); canvas.height = Math.round(viewH * DPR); kick(city); };
  resize(); new ResizeObserver(resize).observe(wrap);
  const [fx, fy] = iso(...city.focus);
  if (!city.cam) {
    const saved = state.cameras[id];
    if (saved) { city.cam = { ...saved }; clampCam(city); }
    else { city.cam = { x: fx, y: fy, z: 1 / 1.8 }; clampCam(city); animateCam(city, { z: 1 }, 1100); }
  }
  const k = [...state.unlocked].sort().join("|");
  if (lastUnlockKey[id] !== undefined && lastUnlockKey[id] !== k && !motionReduced()) {
    const prev = new Set(lastUnlockKey[id].split("|")), now = performance.now();
    city.objects.forEach((o) => { if (o.layer && !prev.has(o.layer) && isOpen(o.layer)) city.reveal[o.id] = { t0: now, v: 0 }; });
  }
  lastUnlockKey[id] = k;
  $("#c-back").onclick = () => { stopCityLoop(); mapView.mode = "world"; renderMap(); };
  $("#c-in").onclick = () => animateCam(city, { z: city.cam.z * 1.4 }, 300);
  $("#c-out").onclick = () => animateCam(city, { z: city.cam.z / 1.4 }, 300);
  $("#c-reset").onclick = () => animateCam(city, { x: fx, y: fy, z: 1 });
  $("#c-help").onclick = openLegend; $("#c-list").onclick = () => openPlaceList(city);
  attachGestures(city, canvas); startCityLoop(city);
}
function selectObject(city, o) {
  if (!o) { city.selected = null; kick(city); return; }
  city.selected = o.id; kick(city);
  const done = () => { city.selected = null; kick(city); };
  if (o.place) openSheet(placeCard(o.place), done); else openSheet(objectCard(o), done);
}
function attachGestures(city, el) {
  const pts = new Map(); let start = null, pinch = null, last = null, vel = { x: 0, y: 0 };
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.offsetX, e.offsetY]); city.inertia = null; city.camAnim = null;
    if (pts.size === 1) { start = { x: e.offsetX, y: e.offsetY, t: performance.now() }; last = { ...start }; vel = { x: 0, y: 0 }; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: city.cam.z, mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; start = null; }
  });
  el.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pts.size >= 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], before = toScene(city, ...pinch.mid);
      city.cam.z = Math.min(ZMAX, Math.max(ZMIN, pinch.z * d / Math.max(pinch.d, 1)));
      const after = toScene(city, ...mid); city.cam.x += before[0] - after[0]; city.cam.y += before[1] - after[1]; pinch.mid = mid; clampCam(city); kick(city); return;
    }
    if (pinch || !last) return;
    const dx = e.offsetX - prev[0], dy = e.offsetY - prev[1];
    city.cam.x -= dx / city.cam.z; city.cam.y -= dy / city.cam.z; clampCam(city);
    const now = performance.now(), dt = Math.max(1, now - last.t); vel = { x: dx * 16 / dt, y: dy * 16 / dt }; last = { x: e.offsetX, y: e.offsetY, t: now }; kick(city);
  });
  const end = (e) => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size < 2 && pinch) { pinch = null; last = { x: 0, y: 0, t: performance.now() }; start = null; }
    if (pts.size === 0) {
      if (start && Math.hypot(e.offsetX - start.x, e.offsetY - start.y) < 8 && performance.now() - start.t < 400) selectObject(city, hitTest(city, e.offsetX, e.offsetY));
      else if (!motionReduced() && Math.hypot(vel.x, vel.y) > 2 && last && performance.now() - last.t < 80) city.inertia = { ...vel };
      start = null; saveCam(city); kick(city);
    }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("wheel", (e) => { e.preventDefault(); const b = toScene(city, e.offsetX, e.offsetY); city.cam.z = Math.min(ZMAX, Math.max(ZMIN, city.cam.z * Math.exp(-e.deltaY * .0015))); const a = toScene(city, e.offsetX, e.offsetY); city.cam.x += b[0] - a[0]; city.cam.y += b[1] - a[1]; clampCam(city); saveCam(city); kick(city); }, { passive: false });
}
function openPlaceList(city) {
  const places = city.objects.filter((o) => o.place && o.sub !== 1);
  const life = city.objects.filter((o) => !o.place && o.interactive && visible(o) && o.layer);
  const row = (o) => { const ch = chapterOfPlace[o.place], lit = isOpen(ch && ch.id);
    return `<button class="li" data-obj="${o.id}"><span class="ic" style="${lit ? "color:var(--accent)" : ""}">${icon(lit ? "star" : CAT_ICON[PLACES[o.place].cat])}</span><span><span style="display:block">${esc(tr(PLACES[o.place].name))}</span><span class="xs muted">${ch ? `${T("path.chapter", ch.index)} · ${lit ? T("path.isOpen") : T("path.opensAt", ch.n)}` : ""}</span></span></button>`; };
  openSheet(`<h2 class="hp-title">${T("map.list")}</h2><div class="group-h" style="margin-top:6px">${T("map.places")}</div><div class="list">${places.map(row).join("")}</div>
    ${life.length ? `<div class="group-h">${T("map.life")}</div><div class="list">${life.slice(0, 12).map((o) => `<button class="li" data-obj="${o.id}"><span class="ic">${icon("urban")}</span><span>${T(o.name)}</span></button>`).join("")}</div>` : ""}
    <button class="btn full" style="margin-top:14px" data-close>${T("common.close")}</button>`);
  document.querySelectorAll("[data-obj]").forEach((b) => (b.onclick = () => { const o = city.objects.find((q) => q.id === b.dataset.obj); closeSheet(true); focusObject(city, o.id); setTimeout(() => selectObject(city, o), motionReduced() ? 0 : 380); }));
}
function openLegend() {
  const r = (ic, k, st = "") => `<div class="li"><span class="ic" style="${st}">${icon(ic)}</span><span>${T(k)}</span></div>`;
  openSheet(`<h2 class="hp-title">${T("map.legend")}</h2><div class="demo" style="margin:10px 0 4px">${T("map.disclaimer")}</div>

function renderPath() {
  const row = (c) => {
    const on = isOpen(c.id), isNew = isReallyOpen(c.id) && !state.viewed.includes(c.id);
    return `<div class="tl ${on ? "on" : ""}"><div class="dot">${on ? icon("star", 'style="width:14px;height:14px"') : c.index}</div>
      <div class="tl-body"><div class="kicker">${esc(tr(c.year))}${c.city ? " · " + T("city." + c.city) : ""}</div>
        <div class="tl-title">${esc(chTitle(c))}${isNew ? `<span class="newb">${T("path.new")}</span>` : ""}</div>
        <div class="xs muted">${on ? T("path.isOpen") : T("path.opensAt", c.n)}</div>
        ${on ? `<div style="display:flex;gap:8px;margin-top:8px"><button class="chip-btn" data-read="${c.id}">${T("path.read")}</button>${c.city ? `<button class="chip-btn ghost" data-go="${c.id}">${T("path.show")}</button>` : ""}</div>` : ""}</div></div>`;
  };
  const cur = currentLevel();
  const groups = LEVELS.map((l, i) => {
    const chs = CH.filter((c) => c.n > l.from && c.n <= l.to), reached = state.total >= l.to, active = i === cur;
    return `<div class="lvl-head ${reached ? "done" : active ? "active" : ""}"><span class="lvl-badge">${reached ? "★" : i + 1}</span><div style="flex:1">
      <div class="kicker">${T("level.head", i + 1, esc(tr(l.name)))}</div><div class="xs muted">${fmt(l.from)} – ${fmt(l.to)}</div></div></div>
      <div class="timeline">${chs.map(row).join("")}</div>`;
  }).join("");
  $("#s-path").innerHTML = `<div class="topbar"><h1>${T("path.title")}</h1></div><div class="pad">${progressCard()}<p class="foot">${T("path.footer")}</p>${groups}</div>`;
  document.querySelectorAll("[data-read]").forEach((b) => (b.onclick = () => { const ch = CH.find((c) => c.id === b.dataset.read); openSheet(chapterCard(ch, true)); const m = $("#card-map"); if (m) m.onclick = () => { closeSheet(true); explore(ch); }; }));
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { const ch = CH.find((c) => c.id === b.dataset.go); markViewed(ch.id); openCity(ch.city, chapterFocus(ch)); }));
}

/* ---- auth state ---- */
let authState = { state: "guest", user: null, message: null };
function updateAuthUI() { if (currentTab === "settings") renderSettings(); }
function handleAuthEvent(e) {
  authState = e.detail;
  updateAuthUI();
}

  window.addEventListener("zikr:auth", handleAuthEvent);
  post({ type: "auth.getState" });
}
function authCommand(type) {

  post({ type });
}

  const tg = (k, label) => `<label class="switch"><span>${T(label)}</span><span class="toggle"><input type="checkbox" data-set="${k}" ${s[k] ? "checked" : ""}><span></span></span></label>`;

        <div class="list" style="margin-top:16px"><button class="li" id="auth-out">${T("auth.out")}</button>
        <button class="li" id="auth-delete" style="color:#B3261E">${T("auth.delete")}</button></div></div>`;
    } else if (authSt === "error") {

function applyMotionClass() { document.body.classList.toggle("reduced", motionReduced()); }
let wakeLock = null;
async function updateWakeLock() {
  const want = state.settings.keepAwake && currentTab === "zikr" && document.visibilityState === "visible";
  if (IS_APP) { post({ type: "keepAwake", on: want }); return; }
  try { if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { updateWakeLock(); if (document.visibilityState === "visible" && currentTab === "zikr") refreshZikr(); });

/* ---------- onboarding ---------- */
function showOnboarding() {
  let page = 0; const pages = [["onb.1t", "onb.1x", true], ["onb.2t", "onb.2x", "path"], ["onb.3t", "onb.3x", "sacred"]];
  const el = document.createElement("div"); el.className = "onb"; el.id = "onb";
  const draw = () => {
    const [t, x, v] = pages[page];
    el.innerHTML = `<div style="display:flex;justify-content:flex-end;padding:8px 10px"><button class="btn" style="border:none;background:none" id="o-skip">${T("onb.skip")}</button></div>
      <div class="body">${v === true ? `<p class="arabic" lang="ar">أَسْتَغْفِرُ اللَّهَ</p><p class="translit">Astaghfirullah</p>` : `<div style="color:var(--accent)">${icon(v, 'style="width:64px;height:64px;stroke-width:1.3"')}</div>`}
        <h2>${T(t)}</h2><p class="muted" style="max-width:34ch;margin:0">${T(x)}</p>
        ${page === 0 ? `<div style="margin-top:10px"><div class="kicker" style="margin-bottom:6px">${T("onb.lang")}</div>${langPicker("onb-langs")}</div>` : ""}</div>
      <div class="dots">${pages.map((_, i) => `<i class="${i === page ? "on" : ""}"></i>`).join("")}</div>
      <div style="padding:0 20px 20px"><button class="btn primary full" id="o-next">${T(page < 2 ? "onb.next" : "onb.start")}</button></div>`;
    $("#o-skip", el).onclick = finish; $("#o-next", el).onclick = () => { if (page < 2) { page++; draw(); } else finish(); };
    bindLang(el, () => { draw(); renderAll(); });
  };
  const finish = () => { state.onboarded = true; persist(); closeOnboarding(); };
  document.body.appendChild(el); draw();
}
function closeOnboarding() { const o = $("#onb"); if (o) o.remove(); }

/* ---------- старт ---------- */
function renderAll() {
  document.documentElement.lang = L();
  renderTabbar();
  ({ zikr: renderZikr, map: renderMap, path: renderPath, info: renderInfo, settings: renderSettings })[currentTab]();
}
if (mq.addEventListener) mq.addEventListener("change", applyMotionClass);
evaluate(false); applyMotionClass(); renderAll();
if (!state.onboarded) showOnboarding();
connectCloud();
