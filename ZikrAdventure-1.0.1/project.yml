# Запасной вариант: описание проекта для XcodeGen (если понадобится пересоздать Xcode-проект).
#   brew install xcodegen && xcodegen generate
# Основной вариант — готовый ZikrAdventure.xcodeproj в этой же папке.
name: ZikrAdventure
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  ZikrAdventure:
    type: application
    platform: iOS
    sources:
      - path: ZikrAdventure/App
      - path: ZikrAdventure/Resources
      - path: ZikrAdventure/Web
        type: folder
        buildPhase: resources
      - path: ZikrAdventure/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komronkhisomov.zikradventure
        INFOPLIST_FILE: ZikrAdventure/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: ZikrAdventure/ZikrAdventure.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
