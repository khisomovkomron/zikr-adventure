# Сборка и отправка в App Store БЕЗ собственного Mac — через облачный сервис Codemagic (codemagic.io).
# Подготовка (один раз):
#   1. App Store Connect → Users and Access → Integrations → создайте API-ключ (роль App Manager).
#   2. Codemagic → Team settings → Integrations → Developer Portal → добавьте этот ключ.
#      Имя, которое вы ему дадите, впишите ниже вместо «ZikrAdventureKey».
#   3. Замените bundle_identifier ниже и в Xcode-проекте на свой.
# Этот файл не проверялся фактическим запуском.
workflows:
  ios-appstore:
    name: Zikr Adventure — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ZikrAdventureKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.komronkhisomov.zikradventure
      vars:
        XCODE_PROJECT: "ZikrAdventure.xcodeproj"
        XCODE_SCHEME: "ZikrAdventure"
      xcode: latest
    scripts:
      - name: Номер сборки
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = \"2\"/CURRENT_PROJECT_VERSION = \"$BUILD_NUMBER\"/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Подпись приложения
        script: xcode-project use-profiles
      - name: Сборка .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
