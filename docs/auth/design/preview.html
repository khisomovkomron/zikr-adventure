<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zikr — макеты аккаунта 1.1.0</title>
<style>
:root{--bg:#E6E0D4;--surface:#F6F2EA;--text:#1C2333;--muted:#5A5F6B;--line:#CFC5B1;--accent:#735722;--danger:#A32727}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,system-ui,sans-serif}body.dark{--bg:#0F1522;--surface:#1A2334;--text:#EFE8DA;--muted:#AFA99D;--line:#3E485A;--accent:#CBA863;--danger:#FF9C9C}header{padding:24px;max-width:1400px;margin:auto}h1,h2{font-family:Georgia,serif}h1{margin:0;font-size:30px}header p{color:var(--muted);max-width:800px}label{display:inline-flex;gap:10px;align-items:center;margin:8px 18px 8px 0}button,select{font:inherit;min-height:48px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--text)}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{cursor:default;opacity:.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;padding:0 24px 40px;max-width:1400px;margin:auto}.sample{min-width:0}.caption{font-size:14px;color:var(--muted);margin-bottom:8px}.phone{border:1px solid var(--line);border-radius:26px;padding:22px 18px;background:var(--surface);min-height:590px;overflow-wrap:anywhere}.top{display:flex;align-items:center;gap:12px}.top h2{font-size:23px;margin:0}.card{margin:24px 0;padding:18px 0;border-top:1px solid var(--line)}.title{font-size:21px;font-weight:600}p{margin:12px 0}.muted{color:var(--muted)}.local{font-size:15px;color:var(--muted);padding:16px;background:var(--bg);border-radius:14px;margin:22px 0}.provider{width:100%;margin:7px 0;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:8px;min-height:52px}.apple{background:#000;color:#fff;border-color:#000}.google{background:#fff;color:#1f1f1f;border-color:#747775;font-family:Arial,sans-serif}.mark{font-weight:bold;font-size:23px}.actions{display:grid;gap:10px}.danger{color:var(--danger)}.error{padding:14px;border:1px solid var(--danger);border-radius:12px;color:var(--danger)}a{color:var(--accent)}.dialog{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--bg);margin-top:24px}.dialog h3{font-size:20px;margin:0}.dialog .actions{margin-top:20px}.busy{color:var(--muted);padding:14px 0}.badge{display:inline-block;border:1px solid var(--line);padding:4px 9px;border-radius:8px;font-size:13px}body.large{font-size:23px}body.large .local,body.large .caption{font-size:19px}
</style>
<header><span class="badge">ZKR-14 · дизайн · без настоящего входа</span><h1>Аккаунт — Zikr Adventure</h1><p>Макеты состояний для релиза 1.1.0. Переключатели меняют только демонстрацию. Данные приложения не читаются, провайдеры не вызываются. Кнопки здесь схематические; в приложении используются официальные нативные компоненты.</p><label>Язык <select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uz">O‘zbek</option><option value="tg">Тоҷикӣ</option><option value="kk">Қазақша</option><option value="ky">Кыргызча</option></select></label><label><input type="checkbox" id="dark">Тёмная тема</label><label><input type="checkbox" id="large">Крупный текст</label></header><main class="grid" id="grid"></main>
<script>
let messages;const states=['guest','loading','signed','offline','error','signout','delete','reauth','deleting'];
const names=['Без аккаунта','Вход','Аккаунт','Нет сети','Ошибка','Выход','Удаление','Повторный вход','Удаление выполняется'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const code=document.getElementById('lang').value,t=messages[code];document.documentElement.lang=code;const button=(key,extra='')=>`<button ${extra}>${esc(t[key])}</button>`;const providers=busy=>`<button class="provider apple" ${busy?'disabled':''}>${esc(t.apple)}</button><button class="provider google" ${busy?'disabled':''}>${esc(t.google)}</button>`;
document.getElementById('grid').innerHTML=states.map((state,i)=>{const signed=['signed','signout','delete','reauth','deleting'].includes(state);let content=signed?`<div class="title">${esc(t.signed)}</div><p class="muted">Apple · user@privaterelay.appleid.com</p>`:`<div class="title">${esc(t.guest)}</div><p class="muted">${esc(t.intro)}</p>`;content+=`<p class="local">${esc(t.local)}</p>`;
if(!signed){content+=providers(state==='loading');if(state==='loading')content+=`<p class="busy" role="status">${esc(t.loading)}</p>`;if(['error','offline'].includes(state))content+=`<p class="error" role="alert">${esc(t[state])}</p>`;}else if(state==='signed'){content+=`<div class="actions">${button('out')}${button('delete','class="danger"')}</div>`;}else if(state==='deleting'){content+=`<p role="status" class="busy">${esc(t.deleting)}</p>${button('delete','disabled')}`;}else{const out=state==='signout';content+=`<section class="dialog" aria-label="${esc(t[out?'outTitle':'deleteTitle'])}"><h3>${esc(t[out?'outTitle':'deleteTitle'])}</h3><p>${esc(t[state==='reauth'?'reauth':out?'outBody':'deleteBody'])}</p><div class="actions">${button('cancel')}${state==='reauth'?`<button class="provider apple">${esc(t.apple)}</button>`:button(out?'out':'delete',out?'':'class="danger"')}</div></section>`;}
return `<section class="sample" data-state="${state}"><div class="caption">${i+1}. ${names[i]}</div><div class="phone"><div class="top"><span aria-hidden="true">‹</span><h2>${esc(t.title)}</h2></div><div class="card">${content}</div><p><a href="#privacy">${esc(t.privacy)}</a></p><p class="muted">${esc(t.back)}</p></div></section>`;}).join('');}
fetch('strings.json').then(r=>r.json()).then(d=>{messages=d;render();}).catch(()=>document.getElementById('grid').textContent='Запустите preview через локальный HTTP-сервер.');document.getElementById('lang').onchange=()=>render();document.getElementById('dark').onchange=e=>document.body.classList.toggle('dark',e.target.checked);document.getElementById('large').onchange=e=>document.body.classList.toggle('large',e.target.checked);
</script></html>
